<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font: 'DM Sans', sans-serif;
    --bg: #F8F7FC;
    --surface: #FFFFFF;
    --border: rgba(0,0,0,0.09);
    --border-med: rgba(0,0,0,0.15);
    --text: #1A1A2E;
    --text-2: #6B6B84;
    --text-3: #A0A0B8;
    --accent: #7F77DD;
    --accent-light: #EEEDFE;
    --accent-dark: #3C3489;
    --accent-mid: #AFA9EC;
    --teal: #1D9E75;
    --teal-light: #E1F5EE;
    --coral: #D85A30;
    --coral-light: #FAECE7;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --sidebar-w: 240px;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── LAYOUT ── */
  .layout {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 0.5px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 20px 16px 14px;
    border-bottom: 0.5px solid var(--border);
  }

  .app-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 16px;
    flex-shrink: 0;
  }

  .logo-text {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .global-search {
    width: 100%;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border-med);
    background: var(--bg);
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .global-search:focus { border-color: var(--accent); background: white; }

  .sidebar-section-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-3);
    padding: 14px 16px 6px;
  }

  .sidebar-folders {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px;
  }

  .sidebar-folders::-webkit-scrollbar { width: 4px; }
  .sidebar-folders::-webkit-scrollbar-track { background: transparent; }
  .sidebar-folders::-webkit-scrollbar-thumb { background: var(--border-med); border-radius: 99px; }

  .folder-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.1s;
    user-select: none;
  }

  .folder-row:hover { background: var(--bg); }

  .folder-row.active {
    background: var(--accent-light);
  }

  .folder-row-emoji { font-size: 16px; width: 22px; text-align: center; flex-shrink: 0; }

  .folder-row-name {
    font-size: 13px;
    color: var(--text);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .folder-row.active .folder-row-name { color: var(--accent-dark); font-weight: 500; }

  .folder-row-count {
    font-size: 11px;
    color: var(--text-3);
    background: var(--bg);
    padding: 1px 7px;
    border-radius: 99px;
    flex-shrink: 0;
  }

  .folder-row.active .folder-row-count { background: var(--accent-mid); color: var(--accent-dark); }

  .folder-row-edit {
    opacity: 0;
    font-size: 13px;
    color: var(--text-3);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .folder-row:hover .folder-row-edit { opacity: 1; }
  .folder-row-edit:hover { color: var(--text); background: var(--border); }

  .sidebar-footer {
    padding: 10px 8px;
    border-top: 0.5px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .new-folder-btn,
  .import-json-btn {
    width: 100%;
    padding: 9px;
    border-radius: var(--radius-sm);
    border: 0.5px dashed var(--border-med);
    background: none;
    font-family: var(--font);
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    transition: all 0.15s;
  }

  .new-folder-btn:hover,
  .import-json-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  /* ── MAIN AREA ── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    min-width: 0;
  }

  .topbar {
    padding: 16px 24px;
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    flex-shrink: 0;
  }

  .topbar-title {
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: -0.02em;
  }

  .topbar-subtitle {
    font-size: 13px;
    color: var(--text-2);
    font-weight: 400;
  }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-family: var(--font);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
    white-space: nowrap;
  }

  .btn-outline {
    border: 0.5px solid var(--border-med);
    background: none;
    color: var(--text-2);
  }

  .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .btn-teal {
    border: 0.5px solid var(--teal);
    background: none;
    color: var(--teal);
  }

  .btn-teal:hover { background: var(--teal-light); }

  .btn-primary {
    border: none;
    background: var(--accent);
    color: white;
  }

  .btn-primary:hover { background: var(--accent-dark); }

  .btn-danger {
    border: none;
    background: var(--coral);
    color: white;
  }

  /* ── CONTENT ── */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  .content::-webkit-scrollbar { width: 6px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb { background: var(--border-med); border-radius: 99px; }

  /* ── EMPTY STATE ── */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    gap: 12px;
    color: var(--text-2);
    text-align: center;
  }

  .empty-icon { font-size: 48px; }
  .empty-state h2 { font-size: 17px; font-weight: 500; color: var(--text); }
  .empty-state p { font-size: 14px; color: var(--text-2); line-height: 1.6; }

  /* ── SEARCH BAR ── */
  .folder-search-wrap {
    position: relative;
    margin-bottom: 20px;
  }

  .folder-search-wrap input {
    width: 100%;
    padding: 9px 36px 9px 36px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border-med);
    background: var(--surface);
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .folder-search-wrap input:focus { border-color: var(--accent); }

  .search-ic {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--text-3);
    pointer-events: none;
  }

  .search-clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 14px;
    color: var(--text-3);
    cursor: pointer;
    display: none;
  }

  .search-info {
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 14px;
    padding: 6px 10px;
    background: var(--accent-light);
    border-radius: var(--radius-sm);
    display: none;
  }

  /* ── CARDS GRID ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .card-item {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: border-color 0.15s, transform 0.1s;
  }

  .card-item:hover { border-color: var(--border-med); transform: translateY(-1px); }

  .card-item-front {
    padding: 14px 16px 12px;
    border-bottom: 0.5px solid var(--border);
  }

  .card-item-back {
    padding: 12px 16px 14px;
    background: var(--accent-light);
  }

  .side-tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 500;
    margin-bottom: 7px;
  }

  .tag-front { background: var(--bg); color: var(--text-3); }
  .tag-back { background: var(--accent-mid); color: var(--accent-dark); }

  .card-item-text {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
    line-height: 1.5;
  }

  .card-item-subtext {
    font-size: 12px;
    color: var(--text-2);
    margin-top: 4px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-item-meta {
    font-size: 11px;
    color: var(--teal);
    margin-top: 5px;
  }

  .card-item-actions {
    display: flex;
    border-top: 0.5px solid var(--border);
    background: var(--surface);
  }

  .card-act-btn {
    flex: 1;
    padding: 8px;
    background: none;
    border: none;
    font-family: var(--font);
    font-size: 12px;
    cursor: pointer;
    color: var(--accent);
    transition: background 0.1s;
  }

  .card-act-btn:hover { background: var(--accent-light); }

  .card-act-btn.danger { color: var(--coral); }
  .card-act-btn.danger:hover { background: var(--coral-light); }
  .card-act-btn + .card-act-btn { border-left: 0.5px solid var(--border); }

  mark.hl {
    background: #FAC775;
    color: #412402;
    border-radius: 2px;
    padding: 0 2px;
  }

  /* ── STUDY MODE ── */
  .study-wrap {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 640px;
    margin: 0 auto;
    padding-top: 8px;
  }

  .study-progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-track {
    flex: 1;
    height: 5px;
    background: var(--border-med);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .progress-label {
    font-size: 13px;
    color: var(--text-2);
    min-width: 44px;
    text-align: right;
  }

  .study-card-scene {
    perspective: 1200px;
    cursor: pointer;
    user-select: none;
  }

  .study-card {
    min-height: 260px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(.4,.2,.2,1);
  }

  .study-card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    min-height: 260px;
    backface-visibility: hidden;
    border-radius: var(--radius-md);
    border: 0.5px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px;
    gap: 14px;
    transition: box-shadow 0.2s;
  }

  .card-face:hover { box-shadow: 0 4px 24px rgba(127,119,221,0.10); }

  .card-face.back {
    transform: rotateY(180deg);
    background: var(--accent-light);
    border-color: var(--accent-mid);
  }

  .face-badge {
    position: absolute;
    top: 14px;
    left: 18px;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-3);
  }

  .card-face.back .face-badge { color: var(--accent); }

  .face-content {
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .face-text {
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.5;
    letter-spacing: -0.02em;
  }

  .face-img {
    max-width: 100%;
    max-height: 160px;
    border-radius: var(--radius-sm);
    object-fit: contain;
  }

  .flip-hint {
    font-size: 12px;
    color: var(--text-3);
    text-align: center;
    letter-spacing: 0.02em;
  }

  .study-nav {
    display: flex;
    gap: 10px;
  }

  .study-nav .btn { flex: 1; justify-content: center; display: flex; align-items: center; }

  /* ── EDITOR ── */
  .editor-layout {
    display: flex;
    gap: 20px;
    max-width: 800px;
  }

  .editor-sides {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 120px;
    flex-shrink: 0;
  }

  .editor-side-btn {
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border);
    background: none;
    font-family: var(--font);
    font-size: 13px;
    cursor: pointer;
    color: var(--text-2);
    text-align: left;
    transition: all 0.1s;
  }

  .editor-side-btn:hover { border-color: var(--border-med); color: var(--text); background: var(--bg); }

  .editor-side-btn.active {
    background: var(--accent-light);
    border-color: var(--accent-mid);
    color: var(--accent-dark);
    font-weight: 500;
  }

  .editor-panel-wrap { flex: 1; }

  .editor-panel { display: none; flex-direction: column; gap: 16px; }
  .editor-panel.active { display: flex; }

  .field-label {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-3);
    margin-bottom: 6px;
  }

  .rich-editor-wrap {
    border: 0.5px solid var(--border-med);
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--surface);
  }

  .rich-toolbar {
    display: flex;
    gap: 2px;
    padding: 7px 10px;
    background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    flex-wrap: wrap;
  }

  .tb-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 13px;
    padding: 4px 8px;
    border-radius: 6px;
    color: var(--text-2);
    font-family: var(--font);
    transition: all 0.1s;
  }

  .tb-btn:hover { background: var(--surface); color: var(--text); }

  .tb-sep {
    width: 0.5px;
    background: var(--border-med);
    margin: 4px 4px;
  }

  .content-editable {
    min-height: 100px;
    padding: 12px 14px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    line-height: 1.7;
    font-family: var(--font);
  }

  .content-editable:empty::before {
    content: attr(data-placeholder);
    color: var(--text-3);
    pointer-events: none;
  }

  .img-section {
    border: 0.5px dashed var(--border-med);
    border-radius: var(--radius-sm);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .img-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .img-url-input {
    flex: 1;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border-med);
    background: var(--bg);
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    outline: none;
  }

  .img-url-input:focus { border-color: var(--accent); background: white; }

  .upload-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px;
    border-radius: var(--radius-sm);
    border: 0.5px dashed var(--border-med);
    cursor: pointer;
    font-size: 13px;
    color: var(--text-2);
    transition: all 0.15s;
  }

  .upload-label:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  input[type="file"] { display: none; }

  .img-preview-wrap {
    display: none;
    flex-direction: column;
    gap: 8px;
  }

  .img-preview-box {
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--bg);
    border: 0.5px solid var(--border);
  }

  .img-preview-el {
    width: 100%;
    display: block;
    object-fit: contain;
  }

  .fit-controls {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .fit-pill {
    padding: 4px 11px;
    border-radius: 99px;
    border: 0.5px solid var(--border-med);
    background: none;
    font-size: 12px;
    color: var(--text-2);
    cursor: pointer;
    font-family: var(--font);
    transition: all 0.1s;
  }

  .fit-pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .fit-pill:hover { border-color: var(--accent); color: var(--accent); }

  .height-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .height-row label { font-size: 12px; color: var(--text-2); white-space: nowrap; }

  .height-row input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: var(--border-med);
    border-radius: 99px;
    outline: none;
    cursor: pointer;
  }

  .height-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .height-val { font-size: 12px; color: var(--text-2); min-width: 36px; }

  .remove-img-btn {
    background: none;
    border: none;
    font-size: 12px;
    color: var(--coral);
    cursor: pointer;
    padding: 2px 0;
    font-family: var(--font);
    text-align: left;
    width: fit-content;
  }

  /* ── MODALS ── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20,15,40,0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
    backdrop-filter: blur(2px);
  }

  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border-med);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-height: 90vh;
    animation: modal-in 0.2s ease;
  }

  @keyframes modal-in {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-head {
    padding: 16px 20px;
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-title { font-size: 16px; font-weight: 500; color: var(--text); }

  .modal-close {
    background: none;
    border: none;
    font-size: 22px;
    color: var(--text-3);
    cursor: pointer;
    line-height: 1;
    padding: 2px;
  }

  .modal-close:hover { color: var(--text); }

  .modal-body {
    padding: 18px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
  }

  .modal-footer {
    padding: 12px 20px;
    border-top: 0.5px solid var(--border);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  .form-input {
    width: 100%;
    padding: 9px 13px;
    border-radius: var(--radius-sm);
    border: 0.5px solid var(--border-med);
    font-family: var(--font);
    font-size: 14px;
    color: var(--text);
    background: var(--surface);
    outline: none;
    transition: border-color 0.15s;
  }

  .form-input:focus { border-color: var(--accent); }

  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 4px;
  }

  .emoji-opt {
    font-size: 20px;
    text-align: center;
    padding: 5px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.1s;
  }

  .emoji-opt:hover { background: var(--bg); }
  .emoji-opt.selected { background: var(--accent-light); }

  .color-grid { display: flex; gap: 8px; flex-wrap: wrap; }

  .color-swatch {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s;
  }

  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.selected { border-color: var(--text); transform: scale(1.1); }

  /* ── HOME SCREEN ── */
  .home-content { max-width: 740px; }

  .search-results-folders { display: flex; flex-direction: column; gap: 14px; }

  .result-folder-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .result-folder-name { font-size: 14px; font-weight: 500; color: var(--text); }

  .home-folder-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color 0.15s, transform 0.1s;
  }

  .home-folder-card:hover { border-color: var(--border-med); transform: translateY(-1px); }

  .home-folder-icon {
    width: 44px;
    height: 44px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .home-folder-info { flex: 1; min-width: 0; }
  .home-folder-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .home-folder-meta { font-size: 13px; color: var(--text-2); margin-top: 2px; }

  .home-folder-actions { display: flex; gap: 4px; }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    padding: 5px 7px;
    border-radius: var(--radius-sm);
    color: var(--text-3);
    opacity: 0;
    transition: all 0.1s;
  }

  .home-folder-card:hover .icon-btn { opacity: 1; }
  .icon-btn:hover { color: var(--text); background: var(--bg); }
</style>
</head>
<body>
<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <!-- Header -->
    <div class="sidebar-header">
      <div class="app-logo">
        <div class="logo-mark">📚</div>
        <div class="logo-text">Flashcards</div>
      </div>
      <input type="text" class="global-search" id="globalSearch" placeholder="Buscar tarjetas...">
    </div>

    <!-- Folders Section -->
    <div class="sidebar-section-label">CARPETAS</div>
    <div class="sidebar-folders" id="sidebarFolders"></div>

    <!-- Footer with buttons -->
    <div class="sidebar-footer">
      <button class="new-folder-btn" id="newFolderBtn">+ Nueva carpeta</button>
      <button class="import-json-btn" id="importJsonBtn">📥 Importar JSON</button>
      <input type="file" id="jsonFileInput" accept=".json">
    </div>
  </div>

  <!-- MAIN AREA -->
  <div class="main">
    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-title">
        <span id="topbarTitle">Inicio</span>
        <span class="topbar-subtitle" id="topbarSubtitle"></span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-outline" id="newCardBtn" style="display: none;">+ Nueva tarjeta</button>
        <button class="btn btn-primary" id="studyBtn" style="display: none;">Estudiar</button>
      </div>
    </div>

    <!-- Content -->
    <div class="content" id="content"></div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-backdrop" id="newFolderModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Nueva carpeta</div>
      <button class="modal-close" data-close="newFolderModal">✕</button>
    </div>
    <div class="modal-body">
      <div>
        <div class="field-label">Nombre</div>
        <input type="text" class="form-input" id="folderNameInput" placeholder="Mi carpeta...">
      </div>
      <div>
        <div class="field-label">Emoji</div>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" data-close="newFolderModal">Cancelar</button>
      <button class="btn btn-primary" id="createFolderBtn">Crear</button>
    </div>
  </div>
</div>

<script>
  // ────── ESTADOS ──────
  const EMOJIS = ['📋', '🏥', '📖', '💊', '🔬', '⚗️', '🧪', '📝', '✏️', '🎓', '📚', '🏆', '⭐', '💡', '🎯', '📊', '🧬', '🔭', '💻', '🌐', '🧠', '📡', '🎨', '🎭', '🎪', '🎬', '🎤', '🎸', '🎹'];
  let currentFolder = null;
  let currentCardIndex = 0;
  let isStudyMode = false;

  // ────── INICIALIZACIÓN ──────
  document.addEventListener('DOMContentLoaded', () => {
    initializeData();
    renderSidebar();
    showHome();
    setupEventListeners();
  });

  // ────── FUNCIONES DE DATOS ──────
  function initializeData() {
    if (!localStorage.getItem('fc_data')) {
      localStorage.setItem('fc_data', JSON.stringify({ folders: [] }));
    }
  }

  function getData() {
    try {
      const data = JSON.parse(localStorage.getItem('fc_data') || '{"folders":[]}');
      if (!data.folders) data.folders = [];
      return data;
    } catch (e) {
      console.error('Error parsing localStorage:', e);
      return { folders: [] };
    }
  }

  function setData(data) {
    localStorage.setItem('fc_data', JSON.stringify(data));
  }

  // ────── IMPORTAR JSON ──────
  document.getElementById('importJsonBtn').addEventListener('click', () => {
    document.getElementById('jsonFileInput').click();
  });

  document.getElementById('jsonFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const importedData = JSON.parse(event.target.result);
        
        // Validar estructura
        if (!importedData.folders || !Array.isArray(importedData.folders)) {
          alert('⚠️ Formato de JSON inválido. Debe contener un array "folders".');
          return;
        }

        // Obtener datos actuales de forma segura
        let currentData = getData();
        
        // Asegurar que folders existe y es un array
        if (!currentData.folders || !Array.isArray(currentData.folders)) {
          currentData.folders = [];
        }

        // Combinar carpetas
        importedData.folders.forEach(importedFolder => {
          // Asegurar que la carpeta importada tiene estructura básica
          if (!importedFolder.id) importedFolder.id = Date.now();
          if (!Array.isArray(importedFolder.cards)) importedFolder.cards = [];
          
          const existingFolderIndex = currentData.folders.findIndex(f => f && f.id === importedFolder.id);
          
          if (existingFolderIndex !== -1) {
            // Combinar tarjetas si la carpeta existe
            const existingCards = (currentData.folders[existingFolderIndex].cards || []);
            const newCards = (importedFolder.cards || []);
            
            const cardIds = new Set(existingCards.map(c => c && c.id));
            const mergedCards = [...existingCards, ...newCards.filter(c => c && !cardIds.has(c.id))];
            
            currentData.folders[existingFolderIndex].cards = mergedCards;
          } else {
            // Agregar carpeta nueva
            currentData.folders.push(importedFolder);
          }
        });

        setData(currentData);
        renderSidebar();
        renderContent();
        
        alert('✅ JSON importado exitosamente. Tus datos se han combinado correctamente.');
        
        // Limpiar input
        document.getElementById('jsonFileInput').value = '';
      } catch (error) {
        alert('❌ Error al procesar el archivo JSON: ' + error.message);
        console.error(error);
      }
    };
    reader.readAsText(file);
  });

  // ────── SIDEBAR ──────
  function renderSidebar() {
    const data = getData();
    const container = document.getElementById('sidebarFolders');
    container.innerHTML = '';

    data.folders.forEach(folder => {
      const count = folder.cards?.length || 0;
      const el = document.createElement('div');
      el.className = 'folder-row' + (currentFolder?.id === folder.id ? ' active' : '');
      el.innerHTML = `
        <span class="folder-row-emoji">${folder.emoji}</span>
        <span class="folder-row-name">${folder.name}</span>
        <span class="folder-row-count">${count}</span>
        <button class="folder-row-edit" data-edit="${folder.id}">✎</button>
      `;
      el.addEventListener('click', () => showFolder(folder));
      el.querySelector('.folder-row-edit').addEventListener('click', (e) => {
        e.stopPropagation();
        editFolder(folder);
      });
      container.appendChild(el);
    });
  }

  // ────── CARPETAS ──────
  function showFolder(folder) {
    currentFolder = folder;
    currentCardIndex = 0;
    renderSidebar();
    renderContent();
  }

  function showHome() {
    currentFolder = null;
    currentCardIndex = 0;
    renderContent();
  }

  function renderContent() {
    const content = document.getElementById('content');
    const topbarTitle = document.getElementById('topbarTitle');
    const topbarSubtitle = document.getElementById('topbarSubtitle');
    const newCardBtn = document.getElementById('newCardBtn');
    const studyBtn = document.getElementById('studyBtn');

    if (!currentFolder) {
      // HOME VIEW
      topbarTitle.textContent = 'Inicio';
      topbarSubtitle.textContent = '';
      newCardBtn.style.display = 'none';
      studyBtn.style.display = 'none';

      const data = getData();
      if (data.folders.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📚</div>
            <h2>Crea tu primera carpeta</h2>
            <p>Organiza tus tarjetas en carpetas para estudiar de forma efectiva.</p>
          </div>
        `;
        return;
      }

      content.innerHTML = '<div class="home-content"></div>';
      const homeContent = content.querySelector('.home-content');

      data.folders.forEach(folder => {
        const count = folder.cards?.length || 0;
        const card = document.createElement('div');
        card.className = 'home-folder-card';
        card.innerHTML = `
          <div class="home-folder-icon">${folder.emoji}</div>
          <div class="home-folder-info">
            <div class="home-folder-name">${folder.name}</div>
            <div class="home-folder-meta">${count} tarjeta${count !== 1 ? 's' : ''}</div>
          </div>
          <div class="home-folder-actions">
            <button class="icon-btn" data-delete="${folder.id}">🗑️</button>
          </div>
        `;
        card.addEventListener('click', (e) => {
          if (!e.target.closest('.icon-btn')) showFolder(folder);
        });
        card.querySelector('.icon-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm('¿Eliminar esta carpeta?')) deleteFolder(folder.id);
        });
        homeContent.appendChild(card);
      });
      return;
    }

    // FOLDER VIEW
    topbarTitle.textContent = currentFolder.name;
    newCardBtn.style.display = 'inline-block';
    studyBtn.style.display = 'inline-block';

    const cards = currentFolder.cards || [];
    topbarSubtitle.textContent = `${cards.length} tarjeta${cards.length !== 1 ? 's' : ''}`;

    if (cards.length === 0) {
      content.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📝</div>
          <h2>Sin tarjetas</h2>
          <p>Crea una nueva tarjeta para comenzar.</p>
        </div>
      `;
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    cards.forEach((card, idx) => {
      const el = document.createElement('div');
      el.className = 'card-item';
      el.innerHTML = `
        <div class="card-item-front">
          <span class="side-tag tag-front">FRENTE</span>
          <div class="card-item-text">${escapeHtml(card.front)}</div>
          <div class="card-item-subtext">${escapeHtml(card.back)}</div>
        </div>
        <div class="card-item-back">
          <span class="side-tag tag-back">REVERSO</span>
          <div class="card-item-text">${escapeHtml(card.back)}</div>
        </div>
        <div class="card-item-actions">
          <button class="card-act-btn" data-edit="${idx}">Editar</button>
          <button class="card-act-btn danger" data-delete="${idx}">Eliminar</button>
        </div>
      `;
      el.querySelector('[data-edit]').addEventListener('click', () => editCard(idx));
      el.querySelector('[data-delete]').addEventListener('click', () => {
        if (confirm('¿Eliminar tarjeta?')) deleteCard(idx);
      });
      grid.appendChild(el);
    });
    content.innerHTML = '';
    content.appendChild(grid);
  }

  // ────── CARPETAS CRUD ──────
  document.getElementById('newFolderBtn').addEventListener('click', () => {
    document.getElementById('folderNameInput').value = '';
    document.getElementById('emojiGrid').innerHTML = '';
    EMOJIS.forEach(emoji => {
      const btn = document.createElement('button');
      btn.className = 'emoji-opt';
      btn.textContent = emoji;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.emoji-opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
      document.getElementById('emojiGrid').appendChild(btn);
    });
    document.getElementById('emojiGrid').firstChild.classList.add('selected');
    document.getElementById('newFolderModal').classList.add('open');
  });

  document.getElementById('createFolderBtn').addEventListener('click', () => {
    const name = document.getElementById('folderNameInput').value.trim();
    const selected = document.querySelector('.emoji-opt.selected');
    if (!name) return alert('Nombre requerido');

    const data = getData();
    data.folders.push({
      id: Date.now(),
      name,
      emoji: selected.textContent,
      cards: []
    });
    setData(data);
    renderSidebar();
    document.getElementById('newFolderModal').classList.remove('open');
  });

  function editFolder(folder) {
    const newName = prompt('Nuevo nombre:', folder.name);
    if (newName !== null && newName.trim()) {
      const data = getData();
      const f = data.folders.find(x => x.id === folder.id);
      if (f) f.name = newName.trim();
      setData(data);
      currentFolder = f;
      renderSidebar();
      renderContent();
    }
  }

  function deleteFolder(id) {
    const data = getData();
    data.folders = data.folders.filter(f => f.id !== id);
    setData(data);
    showHome();
    renderSidebar();
  }

  // ────── TARJETAS CRUD ──────
  document.getElementById('newCardBtn').addEventListener('click', () => {
    editCard(null);
  });

  function editCard(idx) {
    const card = idx !== null ? currentFolder.cards[idx] : { front: '', back: '' };
    const front = prompt('Frente:', card.front);
    if (front === null) return;
    const back = prompt('Reverso:', card.back);
    if (back === null) return;

    const data = getData();
    const folder = data.folders.find(f => f.id === currentFolder.id);
    if (!folder.cards) folder.cards = [];

    if (idx !== null) {
      folder.cards[idx] = { id: folder.cards[idx].id, front, back };
    } else {
      folder.cards.push({ id: Date.now(), front, back });
    }

    setData(data);
    currentFolder = folder;
    renderContent();
  }

  function deleteCard(idx) {
    const data = getData();
    const folder = data.folders.find(f => f.id === currentFolder.id);
    folder.cards.splice(idx, 1);
    setData(data);
    currentFolder = folder;
    renderContent();
  }

  // ────── UTILIDADES ──────
  function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, m => map[m]);
  }

  // ────── EVENT LISTENERS ──────
  function setupEventListeners() {
    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const modalId = btn.dataset.close;
        document.getElementById(modalId).classList.remove('open');
      });
    });

    document.getElementById('globalSearch').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      if (!query) {
        showHome();
        return;
      }

      const data = getData();
      const results = [];
      data.folders.forEach(folder => {
        const matchedCards = (folder.cards || []).filter(
          card => card.front.toLowerCase().includes(query) || card.back.toLowerCase().includes(query)
        );
        if (matchedCards.length > 0) {
          results.push({ folder, matchedCards });
        }
      });

      const content = document.getElementById('content');
      if (results.length === 0) {
        content.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><h2>Sin resultados</h2></div>';
        return;
      }

      content.innerHTML = '';
      results.forEach(({ folder, matchedCards }) => {
        const section = document.createElement('div');
        section.className = 'search-results-folders';
        
        const header = document.createElement('div');
        header.className = 'result-folder-header';
        header.innerHTML = `<span class="result-folder-name">${folder.emoji} ${folder.name}</span>`;
        section.appendChild(header);

        matchedCards.forEach(card => {
          const el = document.createElement('div');
          el.className = 'home-folder-card';
          el.innerHTML = `
            <div class="home-folder-info">
              <div class="home-folder-name">${escapeHtml(card.front)}</div>
              <div class="home-folder-meta">${escapeHtml(card.back)}</div>
            </div>
          `;
          el.style.cursor = 'pointer';
          el.addEventListener('click', () => {
            showFolder(folder);
            document.getElementById('globalSearch').value = '';
          });
          section.appendChild(el);
        });

        content.appendChild(section);
      });
    });

    document.getElementById('studyBtn').addEventListener('click', () => {
      const cards = currentFolder.cards || [];
      if (cards.length === 0) return;
      
      isStudyMode = true;
      currentCardIndex = 0;
      
      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="study-wrap">
          <div class="study-progress-row">
            <div class="progress-track">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="progress-label"><span id="current">1</span>/<span id="total">${cards.length}</span></span>
          </div>
          <div class="study-card-scene" id="cardScene">
            <div class="study-card" id="card">
              <div class="card-face">
                <span class="face-badge">FRENTE</span>
                <div class="face-content">
                  <div class="face-text" id="frontText">${escapeHtml(cards[0].front)}</div>
                </div>
                <p class="flip-hint">Haz clic para voltear</p>
              </div>
              <div class="card-face back">
                <span class="face-badge">REVERSO</span>
                <div class="face-content">
                  <div class="face-text" id="backText">${escapeHtml(cards[0].back)}</div>
                </div>
              </div>
            </div>
          </div>
          <div class="study-nav">
            <button class="btn btn-outline" id="prevBtn">← Anterior</button>
            <button class="btn btn-outline" id="exitBtn">Salir</button>
            <button class="btn btn-outline" id="nextBtn">Siguiente →</button>
          </div>
        </div>
      `;

      updateStudyProgress();

      const card = document.getElementById('card');
      card.addEventListener('click', () => card.classList.toggle('flipped'));

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentCardIndex > 0) {
          currentCardIndex--;
          updateStudyCard();
        }
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentCardIndex < cards.length - 1) {
          currentCardIndex++;
          updateStudyCard();
        }
      });

      document.getElementById('exitBtn').addEventListener('click', () => {
        isStudyMode = false;
        renderContent();
      });
    });
  }

  function updateStudyCard() {
    const cards = currentFolder.cards;
    const card = cards[currentCardIndex];
    document.getElementById('frontText').textContent = escapeHtml(card.front);
    document.getElementById('backText').textContent = escapeHtml(card.back);
    document.getElementById('current').textContent = currentCardIndex + 1;
    document.getElementById('card').classList.remove('flipped');
    updateStudyProgress();
  }

  function updateStudyProgress() {
    const cards = currentFolder.cards;
    const progress = ((currentCardIndex + 1) / cards.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
  }
</script>
</body>
</html>
